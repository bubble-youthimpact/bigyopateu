<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>비교파트 지도</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #e9edf2;
    font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  /* Same as the working Bubble code: an explicit full-size box. Naver resets the box's
     positioning when the map starts, so sizing by position alone collapses it to 0px tall. */
  #map { position: relative; width: 100%; height: 100%; }
  .notice { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; padding: 24px; text-align: center; color: #454d5e; font-size: 15px; line-height: 1.6; }
  .notice b { display: block; color: #151a28; font-size: 17px; margin-bottom: 6px; }
  .notice small { display: inline-block; margin-top: 8px; color: #7c859b; font-size: 12px; }
  .notice code { background: #fff; padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  @font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-display: swap; src: url("fonts/PretendardVariable-subset.woff2") format("woff2"); }
  .pin-wrap { position: relative; width: 30px; height: 34px; cursor: pointer; }
  .pin { display: block; width: 30px; height: 34px; filter: drop-shadow(0 2px 3px rgba(21,26,40,.3)); transform-origin: 2px 34px; transition: transform .12s ease; }
  .pin-wrap:hover .pin, .pin-wrap.is-active .pin { transform: scale(1.22); }
  .pin-label { position: absolute; left: 16px; bottom: 44px; transform: translateX(-50%); padding: 7px 13px; border-radius: 16px; background: #fff; box-shadow: 0 4px 14px rgba(21,26,40,.16); font-size: 13px; font-weight: 700; color: #151a28; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s ease; }
  .pin-wrap:hover .pin-label { opacity: 1; }
  .pin-wrap.is-active .pin-label { display: none; }
  .pop { position: relative; width: 264px; background: #fff; border-radius: 16px; box-shadow: 0 14px 36px rgba(14,27,63,.24); color: #121a2e; letter-spacing: -0.01em; }
  .pop-photo { height: 132px; background: #e8f0ff; border-radius: 16px 16px 0 0; overflow: hidden; }
  .pop-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pop-x { position: absolute; top: 10px; right: 10px; z-index: 2; width: 30px; height: 30px; border: 0; border-radius: 50%; background: rgba(255,255,255,.95); color: #0e1b3f; font-size: 18px; line-height: 30px; cursor: pointer; box-shadow: 0 2px 8px rgba(14,27,63,.2); }
  .pop-body { padding: 14px 16px 16px; }
  .pop-body small { display: block; color: #7c859b; font-size: 12px; font-weight: 650; }
  .pop-body strong { display: block; margin-top: 1px; font-size: 18px; font-weight: 800; letter-spacing: -0.035em; line-height: 1.3; }
  .pop-stats { display: grid; grid-template-columns: repeat(4, 1fr); margin: 12px 0 14px; border-top: 1px solid #eceef3; border-bottom: 1px solid #eceef3; }
  .pop-stats div { padding: 9px 0; text-align: center; }
  .pop-stats div + div { border-left: 1px solid #eceef3; }
  .pop-stats dt { font-size: 11px; color: #7c859b; }
  .pop-stats dd { margin: 1px 0 0; font-size: 13px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pop-actions { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
  .pop-actions button { min-height: 40px; border-radius: 11px; border: 0; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .pop-open { background: #246bfe; color: #fff; }
  .pop-open:hover { background: #1452db; }
  .pop-cmp { padding: 0 12px; background: #e8f0ff; color: #246bfe; }
  .pop-cmp.is-on { background: #0e1b3f; color: #fff; }
  .pop-tail { position: absolute; z-index: -1; left: 50%; bottom: -7px; width: 14px; height: 14px; margin-left: -7px; background: #fff; transform: rotate(45deg); box-shadow: 4px 4px 8px rgba(14,27,63,.08); }
  .label { padding: 8px 14px; border-radius: 18px; background: #fff; box-shadow: 0 4px 14px rgba(21,26,40,.14); font-size: 13px; font-weight: 650; color: #151a28; white-space: nowrap; pointer-events: none; }
  .cluster { display: inline-block; padding: 10px 16px; border-radius: 999px; background: #206cfd; color: #fff; font-weight: 800; font-size: 14px; border: 2px solid #fff; box-shadow: 0 3px 10px rgba(21,26,40,.3); cursor: pointer; white-space: nowrap; font-variant-numeric: tabular-nums; transform: translate(-50%, -50%); transition: box-shadow .12s ease; }
  .cluster:hover { box-shadow: 0 0 0 5px rgba(32,108,253,.25), 0 3px 10px rgba(21,26,40,.3); }
</style>
</head>
<body>
<div id="map"><div class="notice" id="map-loading"><div><b>지도를 불러오는 중…</b>잠시만 기다려 주세요.</div></div></div>
<script src="js/config.js"></script>
<script src="js/data/apartments.js"></script>
<script>
  // Naver's loader must be a normal <script> tag written while the page is parsing;
  // adding it later makes the map silently never start.
  (function () {
    var C = window.BIGYO_CONFIG || {};
    if (C.naverMapClientId) {
      document.write('<script src="https://openapi.map.naver.com/openapi/v3/maps.js?' + (C.naverMapKeyParam || 'ncpKeyId') + '=' + encodeURIComponent(C.naverMapClientId) + '"><\/script>');
    }
  })();
</script>
<script>
(function () {
  var CONFIG = window.BIGYO_CONFIG || {};
  var ALL = ((window.BIGYO_DATA && window.BIGYO_DATA.apartments) || []).filter(function (a) { return a.lat && a.lng; });
  var embedded = window.parent !== window;
  // Either ALL area bubbles or ALL individual pins — never both.
  // Pins show from the first zoom level where at most 10% of pins overlap (worked out from the data).
  var PIN_ZOOM = 15;
  var map, popup, popupId = null, markers = [], pinById = {}, data = ALL.slice(), compared = [];
  var params = new URLSearchParams(location.search);
  var focusArea = params.get('area');
  var leftInset = parseInt(params.get('inset') || '0', 10);

  function notice(title, body) {
    document.getElementById('map').innerHTML = '<div class="notice"><div><b>' + title + '</b>' + body + '</div></div>';
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function open(id) {
    if (embedded) window.parent.postMessage({ source: 'bigyo-map', type: 'open', id: id }, '*');
    else location.href = 'index.html#/apt/' + encodeURIComponent(id);
  }

  // Marker: the house speech-bubble image; its tail tip (bottom-left) points at the apartment
  function pinHtml(a) {
    return '<div class="pin-wrap" data-id="' + esc(a.id) + '"><img class="pin" src="images/marker.png" alt="" width="30" height="34"><span class="pin-label">' + esc(a.name) + '</span></div>';
  }

  function markActive(id) {
    document.querySelectorAll('.pin-wrap.is-active').forEach(function (el) { el.classList.remove('is-active'); });
    if (id) { var el = document.querySelector('.pin-wrap[data-id="' + CSS.escape(id) + '"]'); if (el) el.classList.add('is-active'); }
  }
  function closePopup() { if (popup) popup.close(); popupId = null; markActive(null); }

  function popupContent(a) {
    var el = document.createElement('div');
    el.className = 'pop';
    var on = compared.indexOf(a.id) >= 0;
    el.innerHTML =
      '<button type="button" class="pop-x" aria-label="닫기">×</button>' +
      (a.image ? '<div class="pop-photo"><img src="' + esc(a.image) + '" alt=""></div>' : '') +
      '<div class="pop-body"><small>' + esc(a.dong || '') + (a.builder ? ' · ' + esc(a.builder) : '') + '</small><strong>' + esc(a.name) + '</strong>' +
        '<dl class="pop-stats">' +
          '<div><dt>세대수</dt><dd>' + (a.households ? a.households.toLocaleString('ko-KR') : '-') + '</dd></div>' +
          '<div><dt>동수</dt><dd>' + (a.buildings ? a.buildings + '개동' : '-') + '</dd></div>' +
          '<div><dt>준공</dt><dd>' + (a.approvedYear || '-') + '</dd></div>' +
          '<div><dt>역 도보</dt><dd>' + (a.subwayMin != null ? a.subwayMin + '분' : '-') + '</dd></div>' +
        '</dl>' +
        '<div class="pop-actions"><button type="button" class="pop-open">상세 정보 보기</button>' +
          (embedded ? '<button type="button" class="pop-cmp' + (on ? ' is-on' : '') + '">' + (on ? '✓ 담김' : '+ 비교') + '</button>' : '') +
        '</div>' +
      '</div><span class="pop-tail"></span>';
    var img = el.querySelector('.pop-photo img');
    if (img) img.onerror = function () { img.parentNode.remove(); };
    el.querySelector('.pop-x').onclick = function (e) { e.stopPropagation(); closePopup(); };
    el.querySelector('.pop-open').onclick = function (e) { e.stopPropagation(); open(a.id); };
    var cmp = el.querySelector('.pop-cmp');
    if (cmp) cmp.onclick = function (e) { e.stopPropagation(); window.parent.postMessage({ source: 'bigyo-map', type: 'compare', id: a.id }, '*'); };
    return el;
  }

  function showPopup(a, marker) {
    popupId = a.id;
    popup.setContent(popupContent(a));
    popup.open(map, marker);          // the map stays where it is (no panning)
    markActive(a.id);
  }

  function clear() {
    markers.forEach(function (m) { m.setMap(null); });
    markers = [];
    pinById = {};
  }

  // Web-Mercator pixel position of an apartment at a zoom level (same tiles as Naver's map)
  function worldPx(a, z) {
    var scale = 256 * Math.pow(2, z), sin = Math.sin(a.lat * Math.PI / 180);
    return { x: (a.lng + 180) / 360 * scale, y: (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * scale };
  }

  function findPinZoom(list) {
    for (var z = 12; z <= 18; z++) {
      var pts = list.map(function (a) { return worldPx(a, z); }), crowded = 0;
      pts.forEach(function (p, i) {
        for (var j = 0; j < pts.length; j++) {
          if (j !== i && Math.abs(p.x - pts[j].x) < 22 && Math.abs(p.y - pts[j].y) < 22) { crowded++; break; }
        }
      });
      if (crowded <= list.length * 0.1) return z;
    }
    return 15;
  }

  function draw() {
    clear();
    if (!data.length) { closePopup(); return; }

    if (map.getZoom() < PIN_ZOOM) {
      // zoomed out: one "N 아파트" bubble per area (동), no pins
      closePopup();
      var groups = {};
      data.forEach(function (a) { (groups[a.dong || ''] = groups[a.dong || ''] || []).push(a); });
      Object.keys(groups).forEach(function (area) {
        var g = groups[area], lat = 0, lng = 0;
        g.forEach(function (a) { lat += a.lat; lng += a.lng; });
        var pos = new naver.maps.LatLng(lat / g.length, lng / g.length);
        var cm = new naver.maps.Marker({
          position: pos, map: map, title: area + ' ' + g.length + '개 단지',
          icon: { content: '<div class="cluster">' + g.length + ' 아파트</div>', anchor: new naver.maps.Point(0, 0) }
        });
        naver.maps.Event.addListener(cm, 'click', function () {
          map.setCenter(pos);
          map.setZoom(PIN_ZOOM, true);      // jump straight to the pin view of this area
        });
        markers.push(cm);
      });
      return;
    }

    // zoomed in: every apartment as its own pin, no bubbles
    data.forEach(function (a) {
      var m = new naver.maps.Marker({
        position: new naver.maps.LatLng(a.lat, a.lng), map: map, title: a.name,
        icon: { content: pinHtml(a), size: new naver.maps.Size(30, 34), anchor: new naver.maps.Point(2, 34) }
      });
      naver.maps.Event.addListener(m, 'click', function () { showPopup(a, m); });
      markers.push(m);
      pinById[a.id] = m;
    });
    // keep an open popup attached to its pin after zooming
    if (popupId) {
      if (pinById[popupId]) { popup.open(map, pinById[popupId]); markActive(popupId); }
      else closePopup();
    }
  }

  function fit(list) {
    if (!list.length) return;
    var b = new naver.maps.LatLngBounds();
    list.forEach(function (a) { b.extend(new naver.maps.LatLng(a.lat, a.lng)); });
    try { map.fitBounds(b, { top: 60, right: 40, bottom: 60, left: 40 + leftInset }); } catch (e) { map.fitBounds(b); }
    if (map.getZoom() > 16) map.setZoom(16);
  }

  // Filters from the page that embeds this map
  window.addEventListener('message', function (e) {
    var msg = e.data || {};
    if (msg.source !== 'bigyo-app') return;
    if (msg.type === 'compare-state') {
      compared = msg.ids || [];
      var btn = document.querySelector('.pop-cmp');
      if (btn && popupId) { var on = compared.indexOf(popupId) >= 0; btn.classList.toggle('is-on', on); btn.textContent = on ? '✓ 담김' : '+ 비교'; }
      return;
    }
    if (!map) return;
    if (msg.type === 'filter') {
      var keys = msg.amenities || [];
      data = ALL.filter(function (a) {
        return (!msg.area || a.dong === msg.area) && keys.every(function (k) { return a[k] === true; });
      });
      draw();
      if (msg.fit) fit(data);
      window.parent.postMessage({ source: 'bigyo-map', type: 'count', count: data.length }, '*');
    }
  });

  window.navermap_authFailure = function () {
    notice('지도 인증에 실패했어요', 'NAVER Cloud 콘솔에서 이 주소(<code>' + esc(location.origin) + '</code>)를<br>Web 서비스 URL로 등록해 주세요.<br><small>코드: AUTH</small>');
  };

  if (!CONFIG.naverMapClientId) {
    notice('지도를 불러올 수 없어요', '<code>js/config.js</code>에 네이버 지도 Client ID를 넣어 주세요.');
    return;
  }

  function start() {
    try {
      var loading = document.getElementById('map-loading');
      if (loading) loading.remove();
      PIN_ZOOM = findPinZoom(ALL);
      map = new naver.maps.Map('map', {
        center: new naver.maps.LatLng(37.5000, 126.9479), zoom: 15,
        zoomControl: false, scaleControl: false, mapDataControl: false
      });
      popup = new naver.maps.InfoWindow({ borderWidth: 0, backgroundColor: 'transparent', disableAnchor: true, pixelOffset: new naver.maps.Point(14, -46) });
      naver.maps.Event.addListener(map, 'zoom_changed', draw);
      naver.maps.Event.addListener(map, 'click', function () { closePopup(); });
      window.addEventListener('resize', function () { map.autoResize(); });

      // Start zoomed out, centred on every apartment (or one area if the page asks for it)
      var first = focusArea ? ALL.filter(function (a) { return a.dong === focusArea; }) : ALL;
      fit(first.length ? first : ALL);
      if (!focusArea && map.getZoom() > 13) map.setZoom(13);
      if (!focusArea && map.getZoom() < 11) map.setZoom(11);
      draw();
      if (embedded) window.parent.postMessage({ source: 'bigyo-map', type: 'ready' }, '*');
    } catch (err) {
      notice('지도를 그리는 중 문제가 생겼어요', esc(String(err && err.message || err)) + '<br><small>코드: DRAW</small>');
    }
  }

  var tries = 0;
  (function waitForNaver() {
    if (window.naver && naver.maps && naver.maps.Map && naver.maps.LatLng) return start();
    if (++tries > 80) {
      var code = !window.naver ? 'NO_SCRIPT' : !naver.maps ? 'NO_MAPS' : 'NO_MAP_CLASS';
      return notice('지도를 불러올 수 없어요', '네이버 지도가 응답하지 않아요. 광고 차단 확장 프로그램을 끄거나 새로고침해 보세요.<br><small>코드: ' + code + '</small>');
    }
    setTimeout(waitForNaver, 100);
  })();
})();
</script>
</body>
</html>
